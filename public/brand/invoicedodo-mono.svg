    <mask id="knock" maskUnits="userSpaceOnUse" x="0" y="0" width="80" height="80">
      <rect width="80" height="80" fill="#fff"/>
      <circle cx="31.5" cy="39" r="6.4" fill="#000"/>
      <circle cx="50.5" cy="39" r="6.4" fill="#000"/>
