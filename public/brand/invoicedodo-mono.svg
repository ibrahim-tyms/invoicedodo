<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 4 64 64" role="img" aria-label="InvoiceDodo">
  <title>InvoiceDodo (one colour)</title>
  <!-- Single-colour mark: set fill via currentColor. The eye is knocked out; a thin gap separates beak and head. -->
  <defs>
    <mask id="cut">
      <rect x="0" y="0" width="70" height="70" fill="#fff"/>
      <circle cx="26" cy="36" r="21.2" fill="#000"/>
    </mask>
    <mask id="eye">
      <rect x="0" y="0" width="70" height="70" fill="#fff"/>
      <circle cx="31" cy="31" r="4.6" fill="#000"/>
      <circle cx="32.3" cy="31" r="2.3" fill="#fff"/>
    </mask>
  </defs>
  <path d="M34 24 Q58.4 21.6 62 39.6 Q62.9 50.4 53.9 49.5 Q55.7 43.2 45.8 42.3 L34 44 Z" fill="currentColor" mask="url(#cut)"/>
  <circle cx="26" cy="36" r="20" fill="currentColor" mask="url(#eye)"/>
</svg>
