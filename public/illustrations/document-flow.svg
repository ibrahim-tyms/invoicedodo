<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img"><title>Document flow: estimate, then invoice, then payment, then receipt</title><rect width="1200" height="450" rx="24" fill="#e3f0ec"/><text x="60" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#242a29" text-anchor="start">From estimate to receipt</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#555b58" text-anchor="start">Which document to send at each stage of a job</text><rect x="60" y="160" width="230" height="200" rx="16" fill="#e6eff6" stroke="#dfe5e2" stroke-width="2"/><rect x="84" y="186" width="44" height="54" rx="6" fill="#fff" stroke="#3b6e96" stroke-width="3"/><rect x="92" y="200" width="28" height="5" rx="2" fill="#3b6e96"/><rect x="92" y="212" width="22" height="5" rx="2" fill="#dfe5e2"/><rect x="92" y="224" width="26" height="5" rx="2" fill="#dfe5e2"/><text x="84" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3b6e96" text-anchor="start">Estimate</text><text x="84" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#242a29" text-anchor="start">Price the job</text><text x="84" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555b58" text-anchor="start">before you start</text><path d="M298 260 h32 m-10 -10 l10 10 l-10 10" fill="none" stroke="#174e48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="345" y="160" width="230" height="200" rx="16" fill="#fff" stroke="#dfe5e2" stroke-width="2"/><rect x="369" y="186" width="44" height="54" rx="6" fill="#fff" stroke="#174e48" stroke-width="3"/><rect x="377" y="200" width="28" height="5" rx="2" fill="#174e48"/><rect x="377" y="212" width="22" height="5" rx="2" fill="#dfe5e2"/><rect x="377" y="224" width="26" height="5" rx="2" fill="#dfe5e2"/><text x="369" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#174e48" text-anchor="start">Invoice</text><text x="369" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#242a29" text-anchor="start">Ask for payment</text><text x="369" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555b58" text-anchor="start">when work is done</text><path d="M583 260 h32 m-10 -10 l10 10 l-10 10" fill="none" stroke="#174e48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="160" width="230" height="200" rx="16" fill="#fbf2d9" stroke="#dfe5e2" stroke-width="2"/><rect x="654" y="186" width="44" height="54" rx="6" fill="#fff" stroke="#7d5f0c" stroke-width="3"/><rect x="662" y="200" width="28" height="5" rx="2" fill="#7d5f0c"/><rect x="662" y="212" width="22" height="5" rx="2" fill="#dfe5e2"/><rect x="662" y="224" width="26" height="5" rx="2" fill="#dfe5e2"/><text x="654" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#7d5f0c" text-anchor="start">Payment</text><text x="654" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#242a29" text-anchor="start">Client pays</text><text x="654" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555b58" text-anchor="start">by card, ACH, Zelle…</text><path d="M868 260 h32 m-10 -10 l10 10 l-10 10" fill="none" stroke="#174e48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="915" y="160" width="230" height="200" rx="16" fill="#d3ebe3" stroke="#dfe5e2" stroke-width="2"/><rect x="939" y="186" width="44" height="54" rx="6" fill="#fff" stroke="#174e48" stroke-width="3"/><rect x="947" y="200" width="28" height="5" rx="2" fill="#174e48"/><rect x="947" y="212" width="22" height="5" rx="2" fill="#dfe5e2"/><rect x="947" y="224" width="26" height="5" rx="2" fill="#dfe5e2"/><text x="939" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#174e48" text-anchor="start">Receipt</text><text x="939" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#242a29" text-anchor="start">Confirm payment</text><text x="939" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#555b58" text-anchor="start">for both your records</text><text x="60" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555b58" text-anchor="start">Selling goods or billing ahead of delivery? A proforma invoice can come before the invoice.</text></svg>