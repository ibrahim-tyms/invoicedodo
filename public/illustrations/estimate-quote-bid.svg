<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img"><title>Estimate vs quote vs bid: approximate price, fixed price, competitive offer</title><rect width="1200" height="460" rx="24" fill="#e3f0ec"/><text x="60" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#242a29" text-anchor="start">Estimate, quote or bid?</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#555b58" text-anchor="start">Same idea, different level of commitment</text><rect x="60" y="150" width="340" height="230" rx="16" fill="#fff" stroke="#dfe5e2" stroke-width="2"/><rect x="84" y="174" width="116" height="30" rx="6" fill="#e6eff6"/><text x="98" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b6e96" text-anchor="start">Flexible</text><text x="84" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#242a29" text-anchor="start">Estimate</text><text x="84" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#3b6e96" text-anchor="start">Approximate price</text><text x="84" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555b58" text-anchor="start">Can change as the job develops</text><rect x="430" y="150" width="340" height="230" rx="16" fill="#fff" stroke="#dfe5e2" stroke-width="2"/><rect x="454" y="174" width="72" height="30" rx="6" fill="#d3ebe3"/><text x="468" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#174e48" text-anchor="start">Firm</text><text x="454" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#242a29" text-anchor="start">Quote</text><text x="454" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#174e48" text-anchor="start">Fixed price</text><text x="454" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555b58" text-anchor="start">For a clearly defined scope</text><rect x="800" y="150" width="340" height="230" rx="16" fill="#fff" stroke="#dfe5e2" stroke-width="2"/><rect x="824" y="174" width="149" height="30" rx="6" fill="#fbf2d9"/><text x="838" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7d5f0c" text-anchor="start">Competitive</text><text x="824" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#242a29" text-anchor="start">Bid</text><text x="824" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#7d5f0c" text-anchor="start">Competitive offer</text><text x="824" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555b58" text-anchor="start">Submitted to win a contract</text><text x="60" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#555b58" text-anchor="start">Whichever you send, add a valid-until date and get written approval before you start.</text></svg>