<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img"><title>Payment terms timeline: due on receipt, Net 15, Net 30, Net 45 and Net 60</title><rect width="1200" height="430" rx="24" fill="#e3f0ec"/><text x="60" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#242a29" text-anchor="start">Payment terms on a timeline</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#555b58" text-anchor="start">When the money is due, counted from the invoice date</text><line x1="90" y1="250" x2="1110" y2="250" stroke="#174e48" stroke-width="6" stroke-linecap="round"/><circle cx="90.0" cy="250" r="16" fill="#fff" stroke="#174e48" stroke-width="6"/><text x="90.0" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#555b58" text-anchor="middle">Day 0</text><rect x="12.0" y="284" width="156" height="44" rx="8" fill="#fff"/><text x="90.0" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#174e48" text-anchor="middle">Due on receipt</text><circle cx="345.0" cy="250" r="16" fill="#fff" stroke="#2d887a" stroke-width="6"/><text x="345.0" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#555b58" text-anchor="middle">Day 15</text><rect x="267.0" y="284" width="156" height="44" rx="8" fill="#fff"/><text x="345.0" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#174e48" text-anchor="middle">Net 15</text><circle cx="600.0" cy="250" r="16" fill="#fff" stroke="#2d887a" stroke-width="6"/><text x="600.0" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#555b58" text-anchor="middle">Day 30</text><rect x="522.0" y="284" width="156" height="44" rx="8" fill="#fff"/><text x="600.0" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#174e48" text-anchor="middle">Net 30</text><circle cx="855.0" cy="250" r="16" fill="#fff" stroke="#2d887a" stroke-width="6"/><text x="855.0" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#555b58" text-anchor="middle">Day 45</text><rect x="777.0" y="284" width="156" height="44" rx="8" fill="#fff"/><text x="855.0" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#174e48" text-anchor="middle">Net 45</text><circle cx="1110.0" cy="250" r="16" fill="#fff" stroke="#2d887a" stroke-width="6"/><text x="1110.0" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#555b58" text-anchor="middle">Day 60</text><rect x="1032.0" y="284" width="156" height="44" rx="8" fill="#fff"/><text x="1110.0" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#174e48" text-anchor="middle">Net 60</text><rect x="70" y="350" width="1060" height="48" rx="10" fill="#fbf2d9"/><text x="600" y="381" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#7d5f0c" text-anchor="middle">Shorter terms usually mean faster payment. Agree terms before the work starts.</text></svg>