<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img"><title>Proforma invoice vs commercial invoice</title><rect width="1200" height="490" rx="24" fill="#e3f0ec"/><text x="60" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#242a29" text-anchor="start">Proforma vs. commercial invoice</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#555b58" text-anchor="start">One comes before the sale is final, the other after</text><rect x="60" y="150" width="525" height="300" rx="16" fill="#fff" stroke="#dfe5e2" stroke-width="2"/><rect x="60" y="150" width="525" height="64" rx="16" fill="#e6eff6"/><rect x="60" y="190" width="525" height="24" fill="#e6eff6"/><text x="88" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3b6e96" text-anchor="start">Proforma invoice</text><text x="557" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3b6e96" text-anchor="end">BEFORE delivery</text><circle cx="98" cy="256" r="6" fill="#3b6e96"/><text x="118" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">A quote in invoice format</text><circle cx="98" cy="304" r="6" fill="#3b6e96"/><text x="118" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">Lets the buyer approve or pay upfront</text><circle cx="98" cy="352" r="6" fill="#3b6e96"/><text x="118" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">Can support an import license or letter of credit</text><circle cx="98" cy="400" r="6" fill="#3b6e96"/><text x="118" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">Not a demand for payment</text><rect x="615" y="150" width="525" height="300" rx="16" fill="#fff" stroke="#dfe5e2" stroke-width="2"/><rect x="615" y="150" width="525" height="64" rx="16" fill="#d3ebe3"/><rect x="615" y="190" width="525" height="24" fill="#d3ebe3"/><text x="643" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#174e48" text-anchor="start">Commercial invoice</text><text x="1112" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#174e48" text-anchor="end">AT / AFTER shipment</text><circle cx="653" cy="256" r="6" fill="#174e48"/><text x="673" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">The final bill for the sale</text><circle cx="653" cy="304" r="6" fill="#174e48"/><text x="673" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">What you're paid against and record</text><circle cx="653" cy="352" r="6" fill="#174e48"/><text x="673" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">Used by customs to assess duties and taxes</text><circle cx="653" cy="400" r="6" fill="#174e48"/><text x="673" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#242a29" text-anchor="start">Required for export and import clearance</text></svg>